<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ENCON · Utility Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f1117;--s1:#161b2e;--s2:#1e2438;--bd:#2c3354;
  --tx:#e8eaf6;--t2:#9499b7;--t3:#5c6080;
  --bl:#4472C4;--cy:#00B0F0;--gn:#70AD47;--yw:#ED7D31;
  --rd:#C00000;--pu:#7030A0;--or:#FF5722;--pk:#E91E63;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI','Inter',sans-serif;background:var(--bg);color:var(--tx);font-size:13px;display:flex;flex-direction:column}
.top{background:var(--s1);border-bottom:1px solid var(--bd);height:50px;padding:0 18px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.logo-ic{width:30px;height:30px;background:linear-gradient(135deg,#4472C4,#00B0F0);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.logo-tx{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px}
.logo-sb{font-size:10px;color:var(--t3)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.mo-wrap{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:7px;padding:4px 10px;border:1px solid var(--bd)}
.mo-wrap span{font-size:11px;color:var(--t3);font-weight:600}
.mo-wrap select{background:none;border:none;color:var(--tx);font-size:12px;font-weight:700;cursor:pointer;outline:none}
.tabs{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 18px;display:flex;flex-shrink:0}
.tab{padding:9px 16px;border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--t3);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:#4472C4;border-bottom-color:#4472C4;font-weight:700}
.lay{display:flex;flex:1;overflow:hidden}
.sb{width:188px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--bd);overflow-y:auto;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.ns{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:10px 13px 3px}
.ni{padding:6px 13px;cursor:pointer;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px;border-left:2px solid transparent;transition:.1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni:hover{color:var(--tx);background:rgba(255,255,255,.03)}
.ni.on{color:#4472C4;background:rgba(68,114,196,.1);border-left-color:#4472C4;font-weight:600}
.ndot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cnt{flex:1;overflow-y:auto;padding:12px 14px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.cnt::-webkit-scrollbar{width:4px}
.cnt::-webkit-scrollbar-thumb{background:var(--bd)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cl{font-size:9.5px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.pills{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:2px}
.pill{padding:3px 10px;border-radius:4px;border:none;cursor:pointer;font-size:10.5px;background:none;color:var(--t3);transition:.1s;font-weight:500}
.pill.on{background:var(--s2);color:var(--tx);font-weight:700}
select{background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:4px 9px;border-radius:6px;font-size:12px;cursor:pointer;outline:none}
/* SECTION HEADER */
.shdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;padding:11px 14px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;border-left:3px solid}
.shdr-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.shdr-stats{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.stat{text-align:right}
.stat-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat-v{font-size:21px;font-weight:700;line-height:1.1}
.stat-u{font-size:9px;color:var(--t3)}
/* KPI */
.ksec{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);padding:3px 0 5px;display:flex;align-items:center;gap:6px}
.ksec::after{content:'';flex:1;height:1px;background:var(--bd)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-bottom:8px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px 11px;border-top:2px solid;cursor:pointer;transition:.12s}
.kpi:hover{background:var(--s2)}
.kpi-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px;line-height:1.3}
.kpi-d{font-size:9px;color:#4472C4;font-weight:700;margin-bottom:1px;display:none}
.kpi-v{font-size:17px;font-weight:700;line-height:1;margin-bottom:2px}
.kpi-v.neg{color:#C00000}
.kpi-u{font-size:9px;color:var(--t3)}
/* DAY PANEL */
.dpanel{background:var(--s1);border:1px solid #4472C4;border-radius:9px;padding:10px 12px;display:none;margin-top:8px}
.dpanel.vis{display:block}
.dpanel-hdr{font-size:11px;font-weight:700;color:#4472C4;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.ditems{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto}
.ditem{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 5px;border-radius:4px}
.ditem:hover{background:rgba(255,255,255,.04)}
.ddot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.dname{color:var(--t2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.dval{font-weight:700;color:var(--tx);flex-shrink:0;font-size:11px}
.dval.neg{color:#C00000}
/* CHARTS */
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px;overflow:hidden}
.pt{font-size:12px;font-weight:700;margin-bottom:1px}
.ps{font-size:10px;color:var(--t3);margin-bottom:8px}
.panel canvas{cursor:crosshair}
/* TABLE */
.twr{overflow:auto;max-height:calc(100vh - 155px);border-radius:8px;border:1px solid var(--bd)}
.twr::-webkit-scrollbar{width:5px;height:5px}
.twr::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
table.dt{border-collapse:collapse;font-size:11px;min-width:1200px;width:100%}
table.dt thead th{background:var(--s2);padding:6px 8px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:3;font-size:10px;font-weight:700;color:var(--t2);border-bottom:1px solid var(--bd)}
table.dt thead th:first-child{text-align:left;position:sticky;left:0;z-index:4;background:var(--s2);min-width:220px}
table.dt thead th.sth{background:rgba(237,125,49,.12);color:#ED7D31;font-weight:800;min-width:75px}
table.dt tbody tr{border-bottom:1px solid rgba(255,255,255,.03)}
table.dt tbody tr:hover{background:rgba(255,255,255,.03)}
table.dt tbody td{padding:4px 7px;text-align:right;white-space:nowrap;color:var(--t2);font-size:11px}
table.dt tbody td:first-child{text-align:left;position:sticky;left:0;background:var(--s1);z-index:2;font-weight:500;color:var(--tx);padding-left:16px}
table.dt tbody tr.shr td{background:rgba(68,114,196,.1);color:#4472C4;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:5px 14px}
table.dt tbody tr.shr td:first-child{position:sticky;left:0;z-index:2;background:rgba(68,114,196,.13)}
table.dt tbody tr.ref-r td{color:var(--t3)}
table.dt td.std{background:rgba(237,125,49,.07);color:#ED7D31;font-weight:700}
table.dt td.neg{color:#C00000}
table.dt td.utd{text-align:center;color:var(--t3);font-size:9px}
/* ENTRY */
.ewr{overflow:auto;border-radius:8px;border:1px solid var(--bd);max-height:calc(100vh - 200px)}
table.et{border-collapse:collapse;font-size:11px}
table.et thead th{background:var(--s2);padding:5px 7px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:3;font-size:10px;font-weight:700;color:var(--t2);border-bottom:1px solid var(--bd);min-width:75px}
table.et thead th:first-child{text-align:left;position:sticky;left:0;z-index:4;background:var(--s2);min-width:205px}
table.et thead th:nth-child(2){position:sticky;left:205px;z-index:4;background:var(--s2);min-width:50px}
table.et thead th.sth{background:rgba(237,125,49,.12);color:#ED7D31;font-weight:800}
table.et tbody td{padding:2px 3px;border:1px solid rgba(255,255,255,.03);white-space:nowrap}
table.et tbody td:first-child{position:sticky;left:0;background:var(--s1);z-index:2;font-weight:500;color:var(--tx);padding:3px 10px;font-size:11.5px}
table.et tbody td:nth-child(2){position:sticky;left:205px;background:var(--s1);z-index:2;text-align:center;color:var(--t3);font-size:9px;padding:3px 5px}
table.et tbody tr.esh td{background:rgba(68,114,196,.08);font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);padding:5px 10px}
table.et tbody tr.esh td:first-child{position:sticky;left:0;z-index:2;background:rgba(68,114,196,.08)}
table.et td.esum{background:rgba(237,125,49,.07);color:#ED7D31;font-weight:700;text-align:right;padding:2px 6px}
table.et td.eneg{color:#C00000}
table.et input{width:70px;padding:2px 3px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);font-size:11px;text-align:right;border-radius:3px;outline:none}
table.et input:focus{border-color:#4472C4;background:rgba(68,114,196,.08)}
table.et input.changed{border-color:#ED7D31;background:rgba(237,125,49,.08)}
/* COMPARE */
.cmp-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px}
.cmp-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cmp-row:last-child{border-bottom:none}
.badge-up{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(112,173,71,.15);color:#70AD47}
.badge-dn{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(192,0,0,.15);color:#FF6B6B}
.cdi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:6px;margin-bottom:10px}
.cdi{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.cdi-n{font-size:9.5px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdi-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.cdi-a{font-size:13px;font-weight:700;color:#4472C4}
.cdi-b{font-size:12px;font-weight:600;color:#00B0F0}
.cdi-d{font-size:10.5px;font-weight:700}
.cdi-d.up{color:#70AD47}
.cdi-d.dn{color:#FF6B6B}
.prog{height:4px;border-radius:2px;background:var(--bd);margin-top:4px;overflow:hidden}
.prog-a{height:100%;background:#4472C4;border-radius:2px}
.prog-b{height:100%;background:#00B0F0;border-radius:2px;margin-top:2px}
.sec-title{font-size:12px;font-weight:700;color:var(--tx);margin:10px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
/* BTNS */
.btnp{background:#4472C4;color:#fff;border:none;padding:6px 15px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.btns{background:var(--s2);color:var(--tx);border:1px solid var(--bd);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn-warn{background:rgba(192,0,0,.15);color:#FF6B6B;border:1px solid rgba(192,0,0,.3);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btnp:hover{background:#5582d4}
.btns:hover{background:rgba(255,255,255,.07)}
.btn-warn:hover{background:rgba(192,0,0,.25)}
.toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:999;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.undo-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 16px;display:none;align-items:center;gap:12px;z-index:998;box-shadow:0 8px 32px rgba(0,0,0,.5);font-size:12px}
.cmp-setup{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.cmp-setup-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--tx)}
.cmp-half{display:inline-flex;flex-direction:column;gap:6px;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--bd)}
.cmp-half-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cmp-run-btn{background:#4472C4;color:#fff;border:none;padding:8px 24px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;margin-top:10px}
.cmp-run-btn:hover{background:#5582d4}
@media(max-width:900px){.sb{display:none}}
</style>
</head>
<body>

<div class="top">
  <div class="logo-ic">⚙</div>
  <div><div class="logo-tx">ENCON Intelligence</div><div class="logo-sb">Utility Monitoring · 2026</div></div>

</div>
<div class="tabs">

</div>
<div class="lay">
  <div class="sb" id="sb"></div>
  <div class="cnt" id="cnt"></div>
</div>
<div class="toast" id="toast"></div>

</div>

let CUSTOM={};
// Detect if running on server or local file
const ON_SERVER = window.location.protocol !== 'file:';
console.log('[ENCON] Mode:', ON_SERVER ? 'SERVER' : 'LOCAL');

async function loadCUSTOM(){
  if(ON_SERVER){
    try{
      let r=await fetch('/api/data');
      let d=await r.json();
      CUSTOM=d||{};
      console.log('[ENCON] Loaded from server, keys:',Object.keys(CUSTOM));
    }catch(e){
      console.warn('[ENCON] Server load failed, using localStorage fallback:',e);
      try{CUSTOM=JSON.parse(localStorage.getItem('encon_v6')||'{}');}catch(e2){}
    }
  } else {
    try{CUSTOM=JSON.parse(localStorage.getItem('encon_v6')||'{}');}catch(e){}
    console.log('[ENCON] Loaded from localStorage, keys:',Object.keys(CUSTOM));
  }
}

async function saveCUSTOM(){
  if(ON_SERVER){
    try{
      await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(CUSTOM)});
      console.log('[ENCON] Saved to server');
    }catch(e){
      console.warn('[ENCON] Server save failed, using localStorage fallback:',e);
      try{localStorage.setItem('encon_v6',JSON.stringify(CUSTOM));}catch(e2){}
    }
  } else {
    try{localStorage.setItem('encon_v6',JSON.stringify(CUSTOM));}catch(e){}
    console.log('[ENCON] Saved to localStorage');
  }
}

// ─── DATA HELPERS ────────────────────────────────────────────────────────────
function moK(y,m){return y+'-'+m;}
function getRaw(y,m){
  if(y===2026&&['Jan','Feb','Mar'].includes(m))return DB[m];
  return CUSTOM[moK(y,m)]||null;
}
function getD(y,m,k,wk=0){
  let db=getRaw(y,m);if(!db)return[];
  let a=(db.data[k]||{}).d||[];let n=db.n;
  if(wk===0)return a.slice(0,n);
  let s=(wk-1)*7,e=Math.min(s+7,n);return a.slice(s,e);
}
function gS(y,m,k,wk=0){return getD(y,m,k,wk).reduce((a,b)=>a+(b||0),0);}
function gN(y,m){let d=getRaw(y,m);return d?d.n:gDIM(y,m);}
function gDIM(y,m){const mp={Jan:31,Feb:y%4===0?29:28,Mar:31,Apr:30,May:31,Jun:30,Jul:31,Aug:31,Sep:30,Oct:31,Nov:30,Dec:31};return mp[m]||30;}
function gU(y,m,k){let d=getRaw(y,m);return d?.data[k]?.u||'';}

function fmt(v,d=1){
  if(v===null||v===undefined||isNaN(v))return'—';
  let n=Number(v);
  if(Math.abs(n)>=1e7)return(n/1e6).toFixed(1)+'M';
  if(Math.abs(n)>=1e4)return(n/1e3).toFixed(1)+'K';
  return n.toFixed(d);
}
function f2(v,d=2){if(v===null||v===undefined||isNaN(v))return'—';return Number(v).toFixed(d);}

function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};}

// ─── TOAST / UNDO ─────────────────────────────────────────────────────────────
function toast(msg,col='#70AD47',dur=2500){
  let t=document.getElementById('toast');
  t.textContent=msg;t.style.background=col;t.style.display='block';
  setTimeout(()=>t.style.display='none',dur);
}
function showUndo(msg){
  document.getElementById('undoMsg').textContent=msg;
  document.getElementById('undoBar').style.display='flex';
  setTimeout(()=>document.getElementById('undoBar').style.display='none',6000);
}
function doUndo(){
  if(!eHist.length)return;
  eData=JSON.parse(JSON.stringify(eHist.pop()));
  document.getElementById('undoBar').style.display='none';
  renderEntry();
  toast('↩ Undone','#ED7D31');
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function buildSB(){
  let h='';
  NAV.forEach(g=>{
    h+=`<div class="ns">${g.lbl}</div>`;
    g.ids.forEach(id=>{
      let s=SECS.find(x=>x.id===id);if(!s)return;
      let i=SECS.indexOf(s);
      h+=`<div class="ni${i===cS?' on':''}" onclick="selSec(${i})">
        <span class="ndot" style="background:${s.col}"></span>${s.icon} ${s.lbl}
      </div>`;
    });
  });
  document.getElementById('sb').innerHTML=h;
}
function selSec(i){cS=i;cW=0;cDay=null;cBarIdx=null;buildSB();renderDash();}

// ─── CHART OPTIONS ───────────────────────────────────────────────────────────
function cOpts(stacked,legend,onCk){
  return{
    responsive:true,maintainAspectRatio:true,animation:{duration:150},
    onClick:onCk||null,
    plugins:{
      legend:{display:legend||false,position:'bottom',labels:{color:'#9499b7',font:{size:9},boxWidth:7,padding:5}},
      tooltip:{mode:'index',intersect:false,backgroundColor:'rgba(10,12,22,.97)',
        titleColor:'#e8eaf6',bodyColor:'#9499b7',borderColor:'#2c3354',borderWidth:1,padding:9,
        callbacks:{label:ctx=>`${ctx.dataset.label}: ${f2(ctx.parsed.y)}`}}
    },
    scales:{
      x:{ticks:{color:'#5c6080',font:{size:9},maxRotation:0,maxTicksLimit:16},grid:{color:'rgba(255,255,255,.04)'},border:{display:false}},
      y:{stacked:stacked||false,ticks:{color:'#5c6080',font:{size:9}},grid:{color:'rgba(255,255,255,.06)'},border:{display:false}}
    }
  };
}
function applyHL(ch,bi){
  if(!ch?.data)return;
  ch.data.datasets.forEach(ds=>{
    let orig=ds._orig||(ds._orig=[...ds.backgroundColor]);
    ds.backgroundColor=bi===null?orig:orig.map((c,i)=>i===bi?c:DIM);
  });
  ch.update('none');
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function renderDash(){
  destroyCharts();
  const sec=SECS[cS];
  const y=cY,m=cM,n=gN(y,m),wk=cW;
  const ds2=wk===0?0:(wk-1)*7;
  const de2=wk===0?n:Math.min(ds2+7,n);
  const labels=Array.from({length:de2-ds2},(_,i)=>`D${i+ds2+1}`);
  const wks=Math.ceil(n/7);
  const SP=sPal(sec.id),LP=lPal(sec.id);

  let wpH=`<button class="pill${wk===0?' on':''}" onclick="setWk(0)">All</button>`;
  for(let w=1;w<=wks;w++)wpH+=`<button class="pill${wk===w?' on':''}" onclick="setWk(${w})">W${w}</button>`;

  let supTot=sec.kpiRef?gS(y,m,sec.kpiRef,wk):sec.keys.reduce((a,k)=>a+gS(y,m,k,wk),0);
  let ldTot=sec.hasLoad?sec.lkeys.reduce((a,k)=>a+gS(y,m,k,wk),0):0;

  const MOS=['Jan','Feb','Mar'];
  let moSup=MOS.map(mo=>{let d=getRaw(y,mo);if(!d)return 0;return sec.kpiRef?gS(y,mo,sec.kpiRef,0):sec.keys.reduce((a,k)=>a+gS(y,mo,k,0),0);});
  let moLd=sec.hasLoad?MOS.map(mo=>{let d=getRaw(y,mo);if(!d)return 0;return sec.lkeys.reduce((a,k)=>a+gS(y,mo,k,0),0);}):[];

  function kBlock(lbl,keys,names,pal,isLd){
    let items=keys.map((k,i)=>{
      let tot=gS(y,m,k,wk),dv=cDay!==null?(getD(y,m,k,wk)[cDay-1-ds2]||0):tot;
      return `<div class="kpi" style="border-top-color:${pal[i%pal.length]}">
        ${cDay!==null?`<div class="kpi-d" style="display:block">Day ${cDay}</div>`:''}
        <div class="kpi-l">${names[i]}</div>
        <div class="kpi-v${dv<0?' neg':''}">${fmt(dv,0)}</div>
        <div class="kpi-u">${gU(y,m,k)||sec.unit}${cDay===null?' รวม':''}</div>
      </div>`;
    }).join('');
    return `<div class="ksec"><span style="color:${isLd?'#C00000':'#4472C4'}">${isLd?'⬇️':'⬆️'}</span>${lbl}</div>
    <div class="kgrid">${items}</div>`;
  }

  let kHtml=kBlock(sec.lbl+' — Supply',sec.keys,sec.names,SP,false);
  if(sec.hasLoad){
    kHtml+=kBlock(sec.lbl.replace('Supply','Load')+' — Load',sec.lkeys,sec.lnames,LP,true);

  }

  // Day detail panel
  let dayHtml='';
  if(cDay!==null){
    let ak=[...sec.keys,...(sec.hasLoad?sec.lkeys:[])];
    let an=[...sec.names,...(sec.hasLoad?sec.lnames:[])];
    let ap=[...SP,...LP];
    let rows=ak.map((k,i)=>{
      let v=(getD(y,m,k,0)[cDay-1])||0;
      return `<div class="ditem"><span class="ddot" style="background:${ap[i%13]}"></span>
        <span class="dname">${an[i]}</span>
        <span class="dval${v<0?' neg':''}">${f2(v)}</span></div>`;
    }).join('');
    dayHtml=`<div class="dpanel vis">
      <div class="dpanel-hdr">📅 Day ${cDay} — ${m} ${y}
        <span onclick="clearDay()" style="cursor:pointer;color:var(--t3);font-size:14px">✕</span>
      </div>
      <div class="ditems">${rows}</div>
    </div>`;
  }

  function mkBar(keys,names,pal){
    return keys.map((k,i)=>({
      label:names[i],data:getD(y,m,k,wk).map(v=>v||0),
      backgroundColor:pal[i%pal.length],_orig:[...Array(de2-ds2)].map(()=>pal[i%pal.length]),
      borderWidth:0,stack:'a'
    }));
  }
  function mkLine(keys,names,pal){
    return keys.map((k,i)=>({
      label:names[i],data:getD(y,m,k,wk).map(v=>v||0),
      borderColor:pal[i%pal.length],backgroundColor:'transparent',
      borderWidth:1.8,fill:false,tension:.4,pointRadius:1.5,pointHoverRadius:3,
      type:'line'
    }));
  }

  let supLine=sec.kpiRef?getD(y,m,sec.kpiRef,wk):labels.map((_,i)=>sec.keys.reduce((a,k)=>a+(getD(y,m,k,wk)[i]||0),0));
  let ldLine=sec.hasLoad?labels.map((_,i)=>sec.lkeys.reduce((a,k)=>a+(getD(y,m,k,wk)[i]||0),0)):[];

  let ckFn=(evt,items)=>{
    if(!items.length)return;
    let bi=items[0].index;
    cBarIdx=cBarIdx===bi?null:bi;
    cDay=cBarIdx===null?null:(ds2+bi+1);
    renderDash();
  };

  let chartArea=sec.hasLoad?`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
    <div class="panel"><div class="pt">⬆️ Supply — Stacked Bar</div><div class="ps">${sec.unit} · คลิกแท่งเพื่อดูรายวัน</div><canvas id="chSup"></canvas></div>
    <div>
      <div class="panel"><div class="pt">⬇️ Load — Stacked Bar</div><div class="ps">${sec.unit}</div><canvas id="chLd"></canvas></div>
      ${dayHtml}
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
    <div class="panel"><div class="pt">📈 Supply vs Load — Line</div><div class="ps">เส้นทึบ=Supply · เส้นประ=Load</div><canvas id="chSL"></canvas></div>

  </div>`:`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
    <div class="panel"><div class="pt">${sec.icon} ${sec.lbl} — Stacked Bar</div><div class="ps">${sec.unit} · คลิกแท่งเพื่อดูรายวัน</div><canvas id="chSup"></canvas></div>
    <div>
      <div class="panel"><div class="pt">📈 Line Trend</div><div class="ps">All sub-items</div><canvas id="chLine"></canvas></div>
      ${dayHtml}
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
    <div class="panel"><div class="pt">📊 Monthly Summary Jan·Feb·Mar ${y}</div><div class="ps">${sec.lbl}</div><canvas id="chMo"></canvas></div>
    <div class="panel"><div class="pt">📈 All Series — Line with Legend</div><div class="ps">แต่ละ series</div><canvas id="chLine2"></canvas></div>
  </div>`;

  document.getElementById('cnt').innerHTML=`
    <div class="ctrl">
      <span style="font-size:14px;font-weight:700">${sec.icon} ${sec.lbl}</span>
      <span style="color:var(--t3)">·</span>
      <span class="cl">Week</span><div class="pills">${wpH}</div>
      ${cDay!==null?`<span onclick="clearDay()" style="font-size:11px;color:#4472C4;font-weight:700;background:rgba(68,114,196,.12);padding:3px 10px;border-radius:5px;cursor:pointer">📅 Day ${cDay} ✕</span>`:''}
    </div>
    <div class="shdr" style="border-left-color:${sec.col}">
      <div class="shdr-t">${sec.icon} ${sec.lbl}</div>
      <div class="shdr-stats">
        <div class="stat"><div class="stat-l">⬆️ Supply รวม</div><div class="stat-v" style="color:${sec.col}">${fmt(supTot,0)}</div><div class="stat-u">${sec.unit}</div></div>
        ${sec.hasLoad?`<div class="stat"><div class="stat-l">⬇️ Load รวม</div><div class="stat-v" style="color:#C00000">${fmt(ldTot,0)}</div><div class="stat-u">${sec.unit}</div></div>`:''}
      </div>
    </div>
    ${kHtml}
    ${chartArea}`;

  setTimeout(()=>{
    let supDS=mkBar(sec.keys,sec.names,SP);
    if(document.getElementById('chSup')){
      charts.sup=new Chart(document.getElementById('chSup'),{type:'bar',data:{labels,datasets:supDS},options:cOpts(true,false,ckFn)});
      if(cBarIdx!==null)applyHL(charts.sup,cBarIdx);
    }
    if(sec.hasLoad&&document.getElementById('chLd')){
      let ldDS=mkBar(sec.lkeys,sec.lnames,LP);
      charts.ld=new Chart(document.getElementById('chLd'),{type:'bar',data:{labels,datasets:ldDS},options:cOpts(true,false,ckFn)});
      if(cBarIdx!==null)applyHL(charts.ld,cBarIdx);
    }
    if(!sec.hasLoad){
      let lineDS=mkLine(sec.keys,sec.names,SP);
      if(document.getElementById('chLine'))charts.line=new Chart(document.getElementById('chLine'),{type:'line',data:{labels,datasets:lineDS},options:cOpts(false,false,ckFn)});
      if(document.getElementById('chLine2'))charts.line2=new Chart(document.getElementById('chLine2'),{type:'line',data:{labels,datasets:lineDS},options:cOpts(false,true)});
    }
    if(sec.hasLoad&&document.getElementById('chSL')){
      charts.sl=new Chart(document.getElementById('chSL'),{type:'line',data:{labels,datasets:[
        {label:'Supply',data:supLine,borderColor:'#4472C4',backgroundColor:'rgba(68,114,196,.1)',fill:true,tension:.4,borderWidth:2,pointRadius:1.5},
        {label:'Load',data:ldLine,borderColor:'#C00000',backgroundColor:'rgba(192,0,0,.07)',fill:true,tension:.4,borderWidth:2,borderDash:[5,3],pointRadius:1.5},
      ]},options:cOpts(false,true,(evt,items)=>{if(items.length){cBarIdx=cDay=ds2+items[0].index+1;renderDash();}})});
    }
    if(document.getElementById('chMo')){
      let mds=sec.hasLoad?[
        {label:'Supply',data:moSup,backgroundColor:'#4472C4CC',borderColor:'#4472C4',borderWidth:1,borderRadius:4},
        {label:'Load',data:moLd,backgroundColor:'#C00000BB',borderColor:'#C00000',borderWidth:1,borderRadius:4},
      ]:[{label:sec.lbl,data:moSup,backgroundColor:sec.col+'BB',borderColor:sec.col,borderWidth:1,borderRadius:4}];
      charts.mo=new Chart(document.getElementById('chMo'),{type:'bar',data:{labels:MOS,datasets:mds},options:cOpts(false,sec.hasLoad)});
    }
  },60);
}

function getUnit2(y,m,k){return gU(y,m,k)||UNIT_MAP[k]||'';}

const MONTH_NAMES={jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};
let xlWB=null;

function detectMo(s){
  let sl=(s||'').toLowerCase();
  for(let[k,v] of Object.entries(MONTH_NAMES)){if(sl.includes(k))return v;}
  return null;
}
function parseSheet(ws,sn){
  let ref=ws['!ref'];if(!ref)return null;
  let rng=XLSX.utils.decode_range(ref);
  let nDays=0;
  for(let c=2;c<=rng.e.c;c++){
    let v=ws[XLSX.utils.encode_cell({r:0,c})]?.v;
    if(v===null||v===undefined||v==='SUM'||v==='')break;
    if(typeof v==='number'&&v>=1&&v<=31)nDays=v;
  }
  if(nDays===0)nDays=Math.min(rng.e.c-2,31);
  let data={};
  for(let r=1;r<=rng.e.r;r++){
    let k=XL_ROW_MAP[String(r)];if(!k)continue;
    // col 1 (0-based) = unit col B in Excel
    let unitCell=ws[XLSX.utils.encode_cell({r,c:1})];
    let unit=(unitCell?.v||UNIT_MAP[k]||'').toString().trim();
    data[k]={
      u: unit,
      d: Array.from({length:nDays},(_,d)=>{
        let v=ws[XLSX.utils.encode_cell({r,c:2+d})]?.v;
        return(v!==undefined&&v!==null&&!isNaN(Number(v)))?Number(v):0;
      })
    };
  }
  return{mo:detectMo(sn),nDays,data};
}

function loadXlFile(file){
  if(!file||!file.name.match(/\.xlsx?$/i)){toast('⚠️ รองรับเฉพาะ .xlsx .xls','#ED7D31');return;}
  let rd=new FileReader();
  rd.onload=function(e){
    try{
      xlWB=XLSX.read(e.target.result,{type:'array',cellDates:false,raw:true});
      renderSheetPanel(file.name);
    }catch(err){toast('❌ อ่านไฟล์ไม่ได้: '+err.message,'#C00000',5000);}
  };
  rd.readAsArrayBuffer(file);
}

async function doImport(n){
  let sheets=xlWB.SheetNames;
  let imported=[];
  for(let i=0;i<n;i++){
    if(!document.getElementById(`xchk${i}`)?.checked)continue;
    let yr=parseInt(document.getElementById(`xyr${i}`)?.value||eY);
    let mo=document.getElementById(`xmo${i}`)?.value||'Jan';
    let ws=xlWB.Sheets[sheets[i]];
    let parsed=parseSheet(ws,sheets[i]);
    if(!parsed)continue;
    let key=moK(yr,mo);
    if(!CUSTOM[key])CUSTOM[key]={n:parsed.nDays,data:{}};
    CUSTOM[key].n=parsed.nDays;
    // เขียนทับทั้งหมดตาม Excel เลย — ข้อมูลเว็บจะตรงกับ Excel เสมอ
    Object.entries(parsed.data).forEach(([k,obj])=>{
      CUSTOM[key].data[k]={d:obj.d, u:obj.u||UNIT_MAP[k]||'', l:k};
    });
    imported.push(`${mo} ${yr}`);
    eY=yr;eM=mo;
  }
  if(!imported.length){toast('⚠️ ไม่ได้เลือก sheet','#ED7D31');return;}
  await saveCUSTOM();
  xlWB=null;
  eData={};eHist=[];
  let db=getRaw(eY,eM);
  if(db){let nm=gDIM(eY,eM);TBL.forEach(g=>g.r.forEach(r=>{eData[r.k]=[...(db.data[r.k]?.d||[])].slice(0,nm);}));}
  renderEntry();
  toast(`✅ นำเข้าสำเร็จ: ${imported.join(', ')} · ตรวจสอบแล้วกด 💾 Save`,'#70AD47',5000);
}

  TBL.forEach(g=>g.r.forEach(r=>{
    if(!CUSTOM[key].data[r.k])CUSTOM[key].data[r.k]={d:[],u:UNIT_MAP[r.k]||'',l:r.l};
    CUSTOM[key].data[r.k].d=(eData[r.k]||[]).slice(0,n).map(v=>parseFloat(v)||0);
    CUSTOM[key].data[r.k].u=CUSTOM[key].data[r.k].u||UNIT_MAP[r.k]||'';
  }));
  try{
    await saveCUSTOM();
    toast(`✅ บันทึก ${eM} ${eY} สำเร็จ — ${ON_SERVER?'🌐 Server':'💾 Local'}`,'#70AD47');
  }catch(e){
    toast(`❌ บันทึกไม่ได้: ${e.message} (localStorage อาจเต็ม)`,'#C00000',5000);
    console.error('[ENCON] Save failed:',e);
  }
}

// Export all data to JSON file
function exportJSON(){
  let data={version:'encon_v6',exported:new Date().toISOString(),data:CUSTOM};
  let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`encon_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('✅ Export JSON สำเร็จ','#70AD47');
}

// Import from JSON backup file
async function importJSON(file){
  let rd=new FileReader();
  rd.onload=async function(e){
    try{
      let obj=JSON.parse(e.target.result);
      let data=obj.data||obj; // support both formats
      // Merge into CUSTOM
      Object.entries(data).forEach(([k,v])=>{CUSTOM[k]=v;});
      localStorage.setItem('encon_v6',JSON.stringify(CUSTOM));
      renderEntry();
      toast(`✅ Import JSON สำเร็จ: ${Object.keys(data).join(', ')}`,'#70AD47',4000);
    }catch(err){toast('❌ ไฟล์ JSON ไม่ถูกต้อง: '+err.message,'#C00000',5000);}
  };
  rd.readAsText(file);
}

// ─── COMPARE — complete rewrite ───────────────────────────────────────────────
function renderCompare(){
  destroyCharts();
  const mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const yrs=[2024,2025,2026,2027,2028];

  function mSel(id,v,fn){return`<select id="${id}" onchange="${fn}">${mos.map(m=>`<option value="${m}"${m===v?' selected':''}>${m}</option>`).join('')}</select>`;}
  function ySel(id,v,fn){return`<select id="${id}" onchange="${fn}">${yrs.map(y=>`<option value="${y}"${y==v?' selected':''}>${y}</option>`).join('')}</select>`;}
  function wSel(id,v,y,m,fn){
    let wk=Math.ceil(gN(y,m)/7);
    let opts=Array.from({length:wk},(_,i)=>`<option value="${i+1}"${v==i+1?' selected':''}>Week ${i+1} (D${(i)*7+1}–D${Math.min((i+1)*7,gN(y,m))})</option>`).join('');
    return`<select id="${id}" onchange="${fn}">${opts}</select>`;
  }
  function dSel(id,v,y,m,fn){
    let n=gN(y,m);
    let opts=`<option value="">-- เลือกวัน --</option>`+Array.from({length:n},(_,i)=>`<option value="${i+1}"${v===i+1?' selected':''}>Day ${i+1}</option>`).join('');
    return`<select id="${id}" onchange="${fn}">${opts}</select>`;
  }
  function secSel(){return`<select id="cpSecSel" onchange="cpSec=this.value">${SECS.map(s=>`<option value="${s.id}"${s.id===cpSec?' selected':''}>${s.icon} ${s.lbl}</option>`).join('')}</select>`;}

  // Build A/B selector rows based on mode
  // Monthly: Year + Month only
  // Weekly:  Year + Month + Week
  // Daily:   Year + Month + Day
  function halfHTML(lbl,color,pfx,yr,mo,wk,day){
    let rows=`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span class="cl">Year</span>${ySel(`cp${pfx}Ysel`,yr,`cp${pfx}Y=parseInt(this.value);renderCompare()`)}
      <span class="cl">Month</span>${mSel(`cp${pfx}Msel`,mo,`cp${pfx}M=this.value;renderCompare()`)}
    </div>`;
    if(cpMode==='weekly'){
      rows+=`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <span class="cl">Week</span>${wSel(`cp${pfx}Wsel`,wk,yr,mo,`cp${pfx}W=parseInt(this.value)`)}
      </div>`;
    } else if(cpMode==='daily'){
      rows+=`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <span class="cl">Day</span>${dSel(`cp${pfx}Dsel`,day,yr,mo,`cp${pfx}D=this.value?parseInt(this.value):null`)}
      </div>`;
    }
    return`<div class="cmp-half">
      <div class="cmp-half-lbl" style="color:${color}">${lbl}</div>
      ${rows}
    </div>`;
  }

  let h=`<div class="cmp-setup">
  <div class="cmp-setup-title">⚙️ ตั้งค่าการเปรียบเทียบ</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px">
    ${halfHTML('📘 ชุด A','#4472C4','A',cpAY,cpAM,cpAW,cpAD)}
    <div style="display:flex;align-items:center;padding-top:18px;font-size:20px;color:var(--t3)">vs</div>
    ${halfHTML('📗 ชุด B','#00B0F0','B',cpBY,cpBM,cpBW,cpBD)}
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:14px">
      <div style="display:flex;align-items:center;gap:6px"><span class="cl">Section</span>${secSel()}</div>
      <div style="display:flex;gap:3px;background:var(--bg);border-radius:6px;padding:2px">
        ${[['monthly','Monthly'],['weekly','Weekly'],['daily','Daily']].map(([md,lbl])=>`<button class="pill${cpMode===md?' on':''}" onclick="cpMode='${md}';cpAW=1;cpAD=null;cpBW=1;cpBD=null;renderCompare()">${lbl}</button>`).join('')}
      </div>
      <button class="cmp-run-btn" onclick="runCompare()">▶ Run Compare</button>
    </div>
  </div>
  </div>
  <div id="cmpResult"></div>`;

  document.getElementById('cnt').innerHTML=h;
}

function runCompare(){
  // Read selections from DOM based on mode
  cpAY=parseInt(document.getElementById('cpAYsel')?.value||cpAY);
  cpAM=document.getElementById('cpAMsel')?.value||cpAM;
  cpBY=parseInt(document.getElementById('cpBYsel')?.value||cpBY);
  cpBM=document.getElementById('cpBMsel')?.value||cpBM;
  cpSec=document.getElementById('cpSecSel')?.value||cpSec;
  // Mode-specific
  if(cpMode==='weekly'){
    cpAW=parseInt(document.getElementById('cpAWsel')?.value||1);
    cpBW=parseInt(document.getElementById('cpBWsel')?.value||1);
    cpAD=null; cpBD=null;
  } else if(cpMode==='daily'){
    cpAD=document.getElementById('cpADsel')?.value?parseInt(document.getElementById('cpADsel').value):null;
    cpBD=document.getElementById('cpBDsel')?.value?parseInt(document.getElementById('cpBDsel').value):null;
    cpAW=0; cpBW=0;
  } else { // monthly
    cpAW=0; cpBW=0; cpAD=null; cpBD=null;
  }

  const sec=SECS.find(s=>s.id===cpSec)||SECS[0];
  const SP=sPal(cpSec),LP=lPal(cpSec);

  // Label for display
  const lA=cpMode==='monthly'?`${cpAM} ${cpAY}`:
           cpMode==='weekly'?`${cpAM} ${cpAY} W${cpAW}`:
           `${cpAM} ${cpAY} Day ${cpAD||'?'}`;
  const lB=cpMode==='monthly'?`${cpBM} ${cpBY}`:
           cpMode==='weekly'?`${cpBM} ${cpBY} W${cpBW}`:
           `${cpBM} ${cpBY} Day ${cpBD||'?'}`;

  destroyCharts();

  // Get aggregate value based on mode
  function supVal(y,m,wk,day,keys,kpiRef){
    if(cpMode==='daily'&&day!==null){return kpiRef?(getD(y,m,kpiRef,0)[day-1]||0):keys.reduce((a,k)=>a+(getD(y,m,k,0)[day-1]||0),0);}
    return kpiRef?gS(y,m,kpiRef,wk):keys.reduce((a,k)=>a+gS(y,m,k,wk),0);
  }
  function ldVal(y,m,wk,day,lkeys){
    if(cpMode==='daily'&&day!==null){return lkeys.reduce((a,k)=>a+(getD(y,m,k,0)[day-1]||0),0);}
    return lkeys.reduce((a,k)=>a+gS(y,m,k,wk),0);
  }
  function itemVal(y,m,wk,day,k){
    if(cpMode==='daily'&&day!==null){return getD(y,m,k,0)[day-1]||0;}
    return gS(y,m,k,wk);
  }

  const sA=supVal(cpAY,cpAM,cpAW,cpAD,sec.keys,sec.kpiRef);
  const sB=supVal(cpBY,cpBM,cpBW,cpBD,sec.keys,sec.kpiRef);
  const lA2=sec.hasLoad?ldVal(cpAY,cpAM,cpAW,cpAD,sec.lkeys):0;
  const lB2=sec.hasLoad?ldVal(cpBY,cpBM,cpBW,cpBD,sec.lkeys):0;

  function diffGrid(keys,names,pal){
    return `<div class="cdi-grid">${keys.map((k,i)=>{
      let vA=itemVal(cpAY,cpAM,cpAW,cpAD,k);
      let vB=itemVal(cpBY,cpBM,cpBW,cpBD,k);
      let d=vA-vB,pct=vB!==0?(d/Math.abs(vB)*100):0;
      let mx=Math.max(Math.abs(vA),Math.abs(vB));
      return`<div class="cdi">
        <div class="cdi-n"><span style="width:8px;height:8px;background:${pal[i%pal.length]};border-radius:2px;display:inline-block;vertical-align:middle;margin-right:4px"></span>${names[i]}</div>
        <div class="cdi-row"><span class="cdi-a">${fmt(vA,2)}</span><span class="cdi-b">${fmt(vB,2)}</span></div>
        <div class="cdi-row"><span class="cdi-d ${d>=0?'up':'dn'}">${d>=0?'+':''}${fmt(d,2)} (${pct.toFixed(1)}%)</span><span style="font-size:9px;color:var(--t3)">${gU(cpAY,cpAM,k)||sec.unit}</span></div>
        <div class="prog"><div class="prog-a" style="width:${mx>0?(Math.abs(vA)/mx*100).toFixed(1):0}%"></div></div>
        <div class="prog"><div class="prog-b" style="width:${mx>0?(Math.abs(vB)/mx*100).toFixed(1):0}%"></div></div>
      </div>`;
    }).join('')}</div>`;
  }

  // Chart data
  function makeChartData(y,m,wk,keys,kpiRef){
    if(kpiRef)return getD(y,m,kpiRef,wk).map(v=>v||0);
    let n=wk===0?gN(y,m):Math.min(7,gN(y,m)-(wk-1)*7);
    return Array.from({length:n},(_,i)=>keys.reduce((a,k)=>a+(getD(y,m,k,wk)[i]||0),0));
  }

  const resDiv=document.getElementById('cmpResult');
  if(!resDiv)return;

  // Summary cards
  let summHtml=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
    <div class="cmp-card">
      <div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px">⬆️ Supply: <span style="color:#4472C4">${lA}</span> vs <span style="color:#00B0F0">${lB}</span></div>
      <div class="cmp-row"><span style="font-size:11px;color:var(--t3)">${lA}</span><span style="font-size:13px;font-weight:700;color:#4472C4">${fmt(sA,2)} ${sec.unit}</span></div>
      <div class="cmp-row"><span style="font-size:11px;color:var(--t3)">${lB}</span><span style="font-size:13px;font-weight:700;color:#00B0F0">${fmt(sB,2)} ${sec.unit}</span></div>
      <div class="cmp-row"><span style="font-size:11px;color:var(--t3)">Δ Diff</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:700;color:${sA-sB>=0?'#70AD47':'#FF6B6B'}">${sA-sB>=0?'+':''}${fmt(sA-sB,2)}</span>
          <span class="${sA-sB>=0?'badge-up':'badge-dn'}">${sA-sB>=0?'▲':'▼'} ${sB!==0?Math.abs((sA-sB)/sB*100).toFixed(1):'—'}%</span>
        </div>
      </div>
    </div>
    ${sec.hasLoad?`<div class="cmp-card">
      <div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px">⬇️ Load: <span style="color:#C00000">${lA}</span> vs <span style="color:#FF7043">${lB}</span></div>
      <div class="cmp-row"><span style="font-size:11px;color:var(--t3)">${lA}</span><span style="font-size:13px;font-weight:700;color:#C00000">${fmt(lA2,2)} ${sec.unit}</span></div>
      <div class="cmp-row"><span style="font-size:11px;color:var(--t3)">${lB}</span><span style="font-size:13px;font-weight:700;color:#FF7043">${fmt(lB2,2)} ${sec.unit}</span></div>
      <div class="cmp-row"><span style="font-size:11px;color:var(--t3)">Δ Diff</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:700;color:${lA2-lB2>=0?'#70AD47':'#FF6B6B'}">${lA2-lB2>=0?'+':''}${fmt(lA2-lB2,2)}</span>
          <span class="${lA2-lB2>=0?'badge-up':'badge-dn'}">${lA2-lB2>=0?'▲':'▼'} ${lB2!==0?Math.abs((lA2-lB2)/lB2*100).toFixed(1):'—'}%</span>
        </div>
      </div>
    </div>`:'<div></div>'}
  </div>`;

  let itemsHtml=`<div class="sec-title"><span style="color:#4472C4">⬆️</span> Supply Items: <b style="color:#4472C4">${lA}</b> vs <b style="color:#00B0F0">${lB}</b>
    <span style="font-size:9px;color:var(--t3);font-weight:400">Blue=A · Teal=B · bar shows proportion</span></div>
  ${diffGrid(sec.keys,sec.names,SP)}
  ${sec.hasLoad?`<div class="sec-title"><span style="color:#C00000">⬇️</span> Load Items: ${lA} vs ${lB}</div>${diffGrid(sec.lkeys,sec.lnames,LP)}`:''}`;

  // ── CHART DESCRIPTIONS ──────────────────────────────────────────────────
  // Monthly: grouped bar — each item side by side (A blue, B teal)
  // Weekly:  grouped bar — each day in the week side by side
  // Daily:   grouped bar — each item side by side (same as monthly)

  const barOpts=(title,unit)=>({
    ...cOpts(false,true),
    plugins:{
      legend:{display:true,position:'bottom',labels:{color:'#9499b7',font:{size:10},boxWidth:10,padding:8}},
      tooltip:{mode:'index',intersect:false,backgroundColor:'rgba(10,12,22,.97)',
        titleColor:'#e8eaf6',bodyColor:'#9499b7',borderColor:'#2c3354',borderWidth:1,padding:9,
        callbacks:{label:ctx=>`${ctx.dataset.label}: ${f2(ctx.parsed.y)} ${unit}`}}
    },
    scales:{
      x:{ticks:{color:'#5c6080',font:{size:9},maxRotation:35},grid:{color:'rgba(255,255,255,.04)'},border:{display:false}},
      y:{ticks:{color:'#5c6080',font:{size:9}},grid:{color:'rgba(255,255,255,.06)'},border:{display:false}}
    }
  });

  // Helper: get per-item values for one "slot" (day or whole period)
  function getItemVals(y,m,keys,wk,day){
    return keys.map(k=>{
      if(day!==null) return getD(y,m,k,0)[day-1]||0;
      return gS(y,m,k,wk);
    });
  }

  // Shorten names for chart x-axis
  const shortNames=names=>names.map(n=>n.length>10?n.slice(0,10)+'…':n);

  let chartHtml='';
  if(cpMode==='monthly'||cpMode==='daily'){
    // Both monthly and daily: grouped bar per item, A vs B side by side
    let modeLabel=cpMode==='daily'?`Day ${cpAD} vs Day ${cpBD}`:`${lA} vs ${lB}`;
    chartHtml=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      <div class="panel" style="overflow-x:auto">
        <div class="pt">⬆️ Supply: ${modeLabel}</div>
        <div class="ps">${sec.unit} per item · Blue=${lA} · Teal=${lB}</div>
        <canvas id="chCA" style="min-width:${sec.keys.length*40}px"></canvas>
      </div>
      ${sec.hasLoad?`<div class="panel" style="overflow-x:auto">
        <div class="pt">⬇️ Load: ${modeLabel}</div>
        <div class="ps">${sec.unit} per item · Red=${lA} · Orange=${lB}</div>
        <canvas id="chCB" style="min-width:${sec.lkeys.length*40}px"></canvas>
      </div>`:'<div></div>'}
    </div>`;
  } else {
    // Weekly: grouped bar per day-in-week
    chartHtml=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      <div class="panel">
        <div class="pt">⬆️ Supply รายวัน: ${lA} vs ${lB}</div>
        <div class="ps">${sec.unit}/day · Blue=${lA} · Teal=${lB}</div>
        <canvas id="chCA"></canvas>
      </div>
      ${sec.hasLoad?`<div class="panel">
        <div class="pt">⬇️ Load รายวัน: ${lA} vs ${lB}</div>
        <div class="ps">${sec.unit}/day · Red=${lA} · Orange=${lB}</div>
        <canvas id="chCB"></canvas>
      </div>`:'<div></div>'}
    </div>`;
  }

  resDiv.innerHTML=summHtml+itemsHtml+chartHtml;

  setTimeout(()=>{
    if(cpMode==='monthly'||cpMode==='daily'){
      // Grouped bar: x-axis = item names, 2 datasets (A, B)
      let vSupA=getItemVals(cpAY,cpAM,sec.keys,cpAW,cpAD);
      let vSupB=getItemVals(cpBY,cpBM,sec.keys,cpBW,cpBD);
      let vLdA=sec.hasLoad?getItemVals(cpAY,cpAM,sec.lkeys,cpAW,cpAD):[];
      let vLdB=sec.hasLoad?getItemVals(cpBY,cpBM,sec.lkeys,cpBW,cpBD):[];

      if(document.getElementById('chCA'))
        charts.ca=new Chart(document.getElementById('chCA'),{type:'bar',
          data:{labels:shortNames(sec.names),datasets:[
            {label:lA,data:vSupA,backgroundColor:'#4472C4CC',borderColor:'#4472C4',borderWidth:1,borderRadius:4,barPercentage:.75},
            {label:lB,data:vSupB,backgroundColor:'#3BC9DBCC',borderColor:'#3BC9DB',borderWidth:1,borderRadius:4,barPercentage:.75},
          ]},options:barOpts(`Supply: ${lA} vs ${lB}`,sec.unit)});

      if(sec.hasLoad&&document.getElementById('chCB'))
        charts.cb=new Chart(document.getElementById('chCB'),{type:'bar',
          data:{labels:shortNames(sec.lnames),datasets:[
            {label:lA,data:vLdA,backgroundColor:'#C00000CC',borderColor:'#C00000',borderWidth:1,borderRadius:4,barPercentage:.75},
            {label:lB,data:vLdB,backgroundColor:'#F07E2ACC',borderColor:'#F07E2A',borderWidth:1,borderRadius:4,barPercentage:.75},
          ]},options:barOpts(`Load: ${lA} vs ${lB}`,sec.unit)});

    } else {
      // Weekly: x-axis = days in that week (D1..D7), grouped bar A vs B
      let nDaysA=Math.min(7,gN(cpAY,cpAM)-(cpAW-1)*7);
      let nDaysB=Math.min(7,gN(cpBY,cpBM)-(cpBW-1)*7);
      let nMax=Math.max(nDaysA,nDaysB);
      let dayLabels=Array.from({length:nMax},(_,i)=>`Day ${i+1}`);
      const pad=(a,n)=>{let r=[...a];while(r.length<n)r.push(null);return r;};

      // Supply total per day (sum all sub-items)
      let dSupA=Array.from({length:nDaysA},(_,i)=>
        sec.kpiRef?(getD(cpAY,cpAM,sec.kpiRef,cpAW)[i]||0):sec.keys.reduce((a,k)=>a+(getD(cpAY,cpAM,k,cpAW)[i]||0),0));
      let dSupB=Array.from({length:nDaysB},(_,i)=>
        sec.kpiRef?(getD(cpBY,cpBM,sec.kpiRef,cpBW)[i]||0):sec.keys.reduce((a,k)=>a+(getD(cpBY,cpBM,k,cpBW)[i]||0),0));

      if(document.getElementById('chCA'))
        charts.ca=new Chart(document.getElementById('chCA'),{type:'bar',
          data:{labels:dayLabels,datasets:[
            {label:lA,data:pad(dSupA,nMax),backgroundColor:'#4472C4CC',borderColor:'#4472C4',borderWidth:1,borderRadius:4,barPercentage:.75},
            {label:lB,data:pad(dSupB,nMax),backgroundColor:'#3BC9DBCC',borderColor:'#3BC9DB',borderWidth:1,borderRadius:4,barPercentage:.75},
          ]},options:barOpts(`Supply: ${lA} vs ${lB}`,sec.unit)});

      if(sec.hasLoad&&document.getElementById('chCB')){
        let dLdA=Array.from({length:nDaysA},(_,i)=>sec.lkeys.reduce((a,k)=>a+(getD(cpAY,cpAM,k,cpAW)[i]||0),0));
        let dLdB=Array.from({length:nDaysB},(_,i)=>sec.lkeys.reduce((a,k)=>a+(getD(cpBY,cpBM,k,cpBW)[i]||0),0));
        charts.cb=new Chart(document.getElementById('chCB'),{type:'bar',
          data:{labels:dayLabels,datasets:[
            {label:lA,data:pad(dLdA,nMax),backgroundColor:'#C00000CC',borderColor:'#C00000',borderWidth:1,borderRadius:4,barPercentage:.75},
            {label:lB,data:pad(dLdB,nMax),backgroundColor:'#F07E2ACC',borderColor:'#F07E2A',borderWidth:1,borderRadius:4,barPercentage:.75},
          ]},options:barOpts(`Load: ${lA} vs ${lB}`,sec.unit)});
      }
    }
  },80);
}

// ─── TAB & MONTH ──────────────────────────────────────────────────────────────
async function showTab(t,btn){
  cTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  document.getElementById('sb').style.display=t==='dash'?'block':'none';
  destroyCharts();
  if(t==='dash'){buildSB();renderDash();}
  else if(t==='table')renderTable();
  else if(t==='entry'){eData={};eHist=[];await loadCUSTOM();renderEntry();}
  else if(t==='compare')renderCompare();
}
function onMC(){
  cY=parseInt(document.getElementById('selY').value);
  cM=document.getElementById('selM').value;
  cW=0;cDay=null;cBarIdx=null;
  document.getElementById('dbadge').textContent=gN(cY,cM)+' days';
  if(cTab==='dash'){buildSB();renderDash();}
  else if(cTab==='table')renderTable();
}
window.onload=async function(){await loadCUSTOM();buildSB();renderDash();};
</script>
